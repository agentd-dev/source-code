name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Format, lint, and the full test suite. agentd is a Linux-native daemon
  # (PR_SET_PDEATHSIG, the subreaper, waitpid, cgroups, unix sockets), so CI is
  # Linux-only — there is no macOS/Windows runtime target. `--all-features` so the
  # feature-gated modules (tls/a2a/cron/metrics/otel/…) are linted and tested
  # too; without it a gated module can rot unseen.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Instruction Specification, so the vendored conformance corpus is
      # checked against the PUBLISHED one rather than trusted. Without this the
      # drift check skips here and runs only where a maintainer happens to have
      # a sibling checkout — which is how a vendored fixture silently forks.
      - uses: actions/checkout@v4
        with:
          repository: instruction-md/specification
          path: .spec-upstream
      - run: echo "INSTRUCTION_SPEC_REPO=$GITHUB_WORKSPACE/.spec-upstream" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The whole workspace under all features: agentd's feature-gated tests
      # (a2a_*_e2e / otel_e2e / …) and the black-box agentd-conformance suite,
      # which builds + drives the real binary, both run here.
      # --no-fail-fast, and the checks after it run even when it fails: one
      # red test binary must not hide the verdict of every binary (and every
      # check) that comes after it.
      - run: cargo test --workspace --all-features --no-fail-fast
      # The published JSON Schemas — the config and workflow schemas, and the
      # A2A extension registry and bundles served at each extension's URI — are
      # generated from the binary and committed, because the site build has no
      # Rust toolchain. Regenerate and compare: a schema that has drifted from
      # the code is worse than none, since an editor or a peer then judges
      # valid documents broken. `git status`, not `git diff`, so a file the
      # generator newly writes and nobody committed fails too.
      - name: published schemas are current
        if: ${{ !cancelled() }}
        run: |
          cargo build -p agentd-cli --all-features
          ./scripts/gen-schemas.sh
          stale=$(git status --porcelain -- web/public/schema web/lib/workflow-nodes.json web/public/a2a web/lib/extensions.json)
          if [ -n "$stale" ]; then
            echo "$stale"
            git diff -- web/public/schema web/lib/workflow-nodes.json web/public/a2a web/lib/extensions.json
            echo "::error::the published schemas are stale — run ./scripts/gen-schemas.sh and commit"
            exit 1
          fi

  # The display clients (interface/): a separate Node package, gated on every
  # push like the daemon — a change on either side of the wire can break the
  # other, so neither side's gate is filtered to its own paths. Build first:
  # the tests import the compiled dist/, which a fresh checkout lacks. The
  # frames are the TUI rendered for the docs; generating them runs the real
  # components, so a render that throws fails here.
  interface:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run frames

  # The contract between the daemon and its clients, held three ways: to the
  # published extension files (the golden examples, validated with ajv), to
  # the real daemon over the wire (live.e2e.mjs, every frame and reply against
  # those files), and to someone else's reading of A2A 1.0 — the official
  # Python SDK as a client of agentd, its hello-world server as a peer of
  # agentd and of the TypeScript client. npm.yml runs the same scripts before
  # it publishes. CI=true turns a missing prerequisite into a failure rather
  # than a skip, so this job cannot pass by running nothing.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: interface/test/stock/requirements.txt
      - run: pip install -r interface/test/stock/requirements.txt
      - run: cargo build -p agentd-cli --features a2a,internal-mocks
      - run: npm ci
        working-directory: interface
      - run: npm run build
        working-directory: interface
      - name: the published extension files
        run: node --test test/contract.test.mjs
        working-directory: interface
      - name: interop with the official A2A SDK
        if: ${{ !cancelled() }}
        run: npm run test:stock
        working-directory: interface
        env:
          AGENTD_E2E_BIN: ${{ github.workspace }}/target/debug/agentd
          AGENTD_STOCK_PYTHON: python
      - name: the TypeScript client against the real daemon
        if: ${{ !cancelled() }}
        run: npm run test:live
        working-directory: interface
        env:
          AGENTD_E2E_BIN: ${{ github.workspace }}/target/debug/agentd

  # The capability-pruning story, proven in CI: every feature combination an
  # operator is likely to ship must build + test clean on its own (feature
  # unification under `--all-features` can hide a broken solo build).
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "" # default: tls + the official MCP SDK
          - "--features a2a" # the A2A listener — agentd's only external channel (RFC 0029)
          - "--features cron"
          - "--features metrics"
          - "--features otel"
          - "--features oauth"
          - "--features hot-reload"
          - "--features config-watch"
          - "--features cel"
          - "--features aauth" # AAuth [DRAFT] — Ed25519 identity + RFC 9421 signing (in the shipped feature set)
          - "--features a2a,hot-reload" # the combo that latently broke once
          - "--release --features internal-mocks" # debug auto-enables it; --release exercises the opt-in path
          - "--features sign" # §7 signing/verification — in the release set
          - "--features oci" # oci:// instruction pulls + cosign — in the release set
          - "--features decrypt" # encrypted instruction envelopes — in the release set
          - "--features a2a,metrics,cron,otel,hot-reload,config-watch,aauth,oauth,cel,sign,oci,decrypt" # the release-artifact set, exactly (pinned by release_matrix.rs)
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Per-feature lint: --all-features unification hides a solo-build clippy
      # error (a dead test helper, a duplicated cfg_attr) — each combo must lint
      # clean on its own, not just compile.
      # The feature graphs of the engine and the CLI shell are isomorphic (the
      # CLI mirrors + forwards); each matrix row gates BOTH crates so a drift
      # between them fails loudly.
      - run: cargo clippy -p agentd-core --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo clippy -p agentd-cli --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test -p agentd-core ${{ matrix.features }} --no-fail-fast
      - if: ${{ !cancelled() }}
        run: cargo test -p agentd-cli ${{ matrix.features }} --no-fail-fast

  # What ships is one static binary on an empty base. That is now the claim
  # worth guarding: MCP and A2A are the official/published implementations
  # (`rmcp`, `a2a-rs`), which bring an async runtime into the *build*, so "few
  # dependencies" stopped being the thing to assert — while "no runtime, no
  # shell, no libc, nothing to attack" did not. `musl-tools` is the only build
  # package: the crypto provider is `ring` throughout, so no C is compiled
  # (see third_party/connectrpc/PATCH.md) — this job is also what would catch
  # `aws-lc-sys` returning, since it installs no cmake.
  static-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # A single transitive crate that forgets `default-features = false` on
      # rustls turns `aws-lc-rs` back on for the whole graph — feature
      # unification is additive, so no amount of care in our own manifests
      # prevents it. That drags in the C/assembly `aws-lc-sys`, which is what
      # made a release build hang for 90 minutes under `cross`. The build below
      # would then fail for want of cmake, but slowly and confusingly; assert it
      # here instead, where the message says what to do.
      - name: Assert the crypto provider is still ring
        run: |
          if cargo tree -p agentd-cli --features a2a --target x86_64-unknown-linux-musl \
               | grep -qE 'aws-lc'; then
            echo "::error::aws-lc is back in the dependency graph — a crate is pulling rustls with default features. See third_party/connectrpc/PATCH.md; run 'cargo tree -i aws-lc-sys' to find it."
            exit 1
          fi
      - name: Build the release binary the image ships
        run: |
          cargo build --release --locked -p agentd-cli \
            --target x86_64-unknown-linux-musl \
            --features "a2a,metrics,cron,otel,hot-reload,config-watch,aauth,oauth,cel,sign,oci,decrypt"
      - name: Assert it is statically linked and runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/agentd
          file "$bin"
          case "$(file -b "$bin")" in
            *static-pie\ linked*|*statically\ linked*) ;;
            *) echo "::error::the release binary is not static — it cannot ship on scratch"; exit 1 ;;
          esac
          "$bin" --version

  # Build the OCI image from the Dockerfile (single-arch smoke build, no push) and
  # prove the static binary runs — so a Dockerfile or static-link regression is
  # caught on every PR, not at release time.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentd:ci
      - name: Smoke-test the image
        run: |
          docker run --rm agentd:ci --version
          docker run --rm agentd:ci --help | grep -q -- '--metrics-addr'
