name: ci

on:
  push:
    branches: [main, rewrite/mcp-native-agent]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Format, lint, and the full test suite. agent is a Linux-native daemon
  # (PR_SET_PDEATHSIG, the subreaper, waitpid, cgroups, unix sockets), so CI is
  # Linux-only — there is no macOS/Windows runtime target. `--all-features` so the
  # feature-gated modules (tls/vsock/serve-mcp/cron/metrics/otel) are linted and
  # tested too; without it a gated module can rot unseen.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The whole workspace under all features: agent's feature-gated tests
      # (serve_mcp / otel_e2e / …) and the black-box agentd-conformance suite,
      # which builds + drives the real binary, both run here.
      - run: cargo test --workspace --all-features

  # The capability-pruning story, proven in CI: every feature combination an
  # operator is likely to ship must build + test clean on its own (feature
  # unification under `--all-features` can hide a broken solo build).
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "" # default: tls + the official MCP SDK
          - "--features a2a" # the A2A v2 HTTPS listener — agentd 2.0's only external channel (RFC 0029)
          - "--features cron"
          - "--features metrics"
          - "--features otel"
          - "--features oauth"
          - "--features cluster"
          - "--features hot-reload"
          - "--features config-watch"
          - "--features workflow"
          - "--features cel"
          - "--features aauth" # AAuth [DRAFT] — Ed25519 identity + RFC 9421 signing (ships build-from-source, like cel)
          - "--features a2a,hot-reload" # the combo that latently broke once
          - "--features cluster,metrics" # the scaling-signal cross combo
          - "--release --features internal-mocks" # debug auto-enables it; --release exercises the opt-in path
          - "--features a2a,metrics,cron,otel,cluster,hot-reload,config-watch,workflow" # the release-artifact set
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Per-feature lint: --all-features unification hides a solo-build clippy
      # error (a dead test helper, a duplicated cfg_attr) — each combo must lint
      # clean on its own, not just compile.
      # The feature graphs of the engine and the CLI shell are isomorphic (the
      # CLI mirrors + forwards); each matrix row gates BOTH crates so a drift
      # between them fails loudly.
      - run: cargo clippy -p agentd-core --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo clippy -p agentd-cli --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test -p agentd-core ${{ matrix.features }}
      - run: cargo test -p agentd-cli ${{ matrix.features }}

  # Check the A2A wire against an INDEPENDENT implementation of the same spec.
  #
  # Our own tests were written from our own reading of the specification, so they
  # cannot catch a *plausible* misreading — a field named the way we assumed, an
  # enum spelled the way we guessed. This boots the real daemon and parses its
  # responses with `a2a-rs`, whose types come from the published schema by way of
  # a different author. It lives outside the workspace (it brings ~180 crates and
  # `cmake`), so it needs its own job.
  a2a-spec-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own workspace, so its own target dir — the cache has to be told.
          workspaces: crates/a2a-oracle -> crates/a2a-oracle/target
      - run: cargo test --manifest-path crates/a2a-oracle/Cargo.toml

  # What ships is one static binary on an empty base. That is now the claim
  # worth guarding: MCP and A2A are the official/published implementations
  # (`rmcp`, `a2a-rs`), which bring an async runtime and a C toolchain into the
  # *build*, so "few dependencies" stopped being the thing to assert — while
  # "no runtime, no shell, no libc, nothing to attack" did not.
  static-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build the release binary the image ships
        run: |
          cargo build --release --locked -p agentd-cli \
            --target x86_64-unknown-linux-musl \
            --features "a2a,metrics,cron,otel,hot-reload,config-watch,aauth,oauth"
      - name: Assert it is statically linked and runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/agentd
          file "$bin"
          case "$(file -b "$bin")" in
            *static-pie\ linked*|*statically\ linked*) ;;
            *) echo "::error::the release binary is not static — it cannot ship on scratch"; exit 1 ;;
          esac
          "$bin" --version

  # Build the OCI image from the Dockerfile (single-arch smoke build, no push) and
  # prove the static binary runs — so a Dockerfile or static-link regression is
  # caught on every PR, not at release time.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentd:ci
      - name: Smoke-test the image
        run: |
          docker run --rm agentd:ci --version
          docker run --rm agentd:ci --help | grep -q -- '--metrics-addr'
