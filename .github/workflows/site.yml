name: site

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", "rfcs/**", "install.sh", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
        # `curl -fsSL https://agentd.dev/install.sh | sh` — served from the repo
        # root script, copied in at build time so there is one source of truth.
        # (web/public/install.sh is gitignored for exactly that reason.)
      - run: cp install.sh web/public/install.sh
      - run: npm run build
        working-directory: web
        # Served from the custom apex domain agentd.dev at the root —
        # no basePath/assetPrefix. The CNAME ships in web/public/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
