name: site

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", "install.sh", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
        # `curl -fsSL https://agentd.dev/install.sh | sh` — served from the repo
        # root script, copied in at build time so there is one source of truth.
        # (web/public/install.sh is gitignored for exactly that reason.)
      - run: cp install.sh web/public/install.sh
      - run: npm run build
        working-directory: web
        # Every URI agentd publishes is also the page that specifies it, with
        # its schema bundle beside it (A2A: an extension's spec should be
        # hosted at its URI). web/lib/extensions.json is the binary's own list
        # (scripts/gen-schemas.sh), so this fails when a declared URI would
        # 404, serve the wrong bundle, or be missing from the sitemap.
      - name: every extension URI serves its spec page and schema
        run: |
          python3 - <<'PY'
          import json, os, sys
          entries = json.load(open("web/lib/extensions.json"))
          sitemap = open("web/out/sitemap.xml").read()
          bad = []
          for e in entries:
              page = os.path.join("web/out", e["path"], "index.html")
              if not os.path.isfile(page):
                  bad.append(f"{e['uri']}: no page at {page}")
              if e["schema"]:
                  f = os.path.join("web/out", e["path"], "schema.json")
                  if not os.path.isfile(f):
                      bad.append(f"{e['uri']}: no schema at {f}")
                  elif json.load(open(f)).get("$id") != e["schema"]:
                      bad.append(f"{e['uri']}: {f} does not carry $id {e['schema']}")
              url = f"https://agentd.dev/{e['path']}/"
              if f"<loc>{url}</loc>" not in sitemap:
                  bad.append(f"{e['uri']}: {url} is not in the sitemap")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY
        # Served from the custom apex domain agentd.dev at the root —
        # no basePath/assetPrefix. The CNAME ships in web/public/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
