# agent conformance suite.
#
# A BLACK-BOX validator of the agent runtime: it knows agentd only as a binary
# plus the A2A / JSON-RPC 2.0 spec, never linking the agentd library — so it can
# catch real protocol/behaviour regressions instead of agreeing with the
# implementation's own types. It drives the real binary (the A2A listener, the
# supervisor, the durable store, the agent loop) and asserts each contract.
#
# Run it two ways:
#   cargo test -p agentd-conformance      # every check as a #[test]
#   cargo run  -p agentd-conformance      # the same checks → a PASS/FAIL report
[package]
name = "agentd-conformance"
version = "1.7.0"
edition = "2024"
rust-version = "1.96"
description = "Black-box conformance suite for the agent runtime (A2A listener + supervisor + agent loop)"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "agentd_conformance"
path = "src/lib.rs"

[[bin]]
name = "agentd-conformance"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# Only for SIGTERM (graceful daemon drain) + reaping in the harness.
libc = "0.2"
# The `companies` family acts as a Personal Agent toward the fake Company: it
# signs ES256 assertions and DPoP Proofs (`ring`) and speaks HTTPS, as client
# and as the server of its own client metadata document (`agentd-net`'s TLS
# connect and acceptor, the transport only). Both are already in the
# workspace's graph — no new crate — and the protocol itself, every JWT,
# proof and request, is written here from the draft, not taken from agentd.
ring = "0.17"
net = { package = "agentd-net", path = "../net", version = "2.0.0", features = ["tls"] }
