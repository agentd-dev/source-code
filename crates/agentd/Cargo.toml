[package]
name = "agentd-core"
version = "1.20.0"
edition = "2024"
rust-version = "1.96"
description = "Minimal, MCP-native agent runtime as a library: the agentic loop, supervisor, workflows, and code-registered tools (the agentd engine)"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/agentd-dev/source-code"
keywords = ["agent", "mcp", "a2a", "llm", "workflow"]
categories = ["development-tools", "network-programming"]

[lib]
name = "agentd"
path = "src/lib.rs"

# Capability surface is compile-time. The default build stays lean — no C/C++
# toolchain, single-digit first-party crates — and HTTPS is the primary
# transport for both intelligence and MCP, so `tls` is ON by default (pure-Rust rustls+ring, no cmake/C build dep). Everything else heavier is
# feature-gated and OFF by default. See rfcs/0002 §dependency-budget.
[features]
default = ["tls"]
# Direct https:// intelligence/MCP (the default transport). rustls with the `ring`
# provider (no cmake/C build dep) + bundled webpki roots — so a scratch container
# has trust anchors with no system CA bundle. On by default; opt out with
# `--no-default-features` to reach https only via a TLS-terminating sidecar.
tls = ["net/tls", "mcp/tls"]
# A2A (Agent2Agent): agentd's channel to other agents and to its own
# display clients. The protocol itself is the A2A project's official Rust SDK
# (github.com/a2aproject/a2a-rs): the specification's types (`a2a-lf`), its
# canonical ProtoJSON (`a2a-pb`), and its server (`a2a-server-lf`) — method
# dispatch, the typed request/response shapes, SSE framing and the error
# mapping come from the spec's own model rather than from our reading of it.
# agentd implements its `RequestHandler` (`a2a::ports`): identity, the role
# matrix, and the durable tasks the reactor owns. The listener is axum over
# tokio-rustls, which is where mTLS client identity is read, so this rides `tls`.
a2a = [
    "tls",
    "dep:a2a-types",
    "dep:a2a-pb",
    "dep:a2a-server",
    "dep:chrono",
    "dep:tokio",
    "dep:axum",
    "dep:tokio-rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
    "dep:futures-util",
    "dep:async-trait",
    "dep:tokio-stream",
]
# Optional cron-expression scheduling (internal time event source).
# Hand-rolled 5-field UTC parser — no dep (the minimalism moat, rfcs/0002).
cron = []
# OAuth 2.1 client-credentials (M2M) auth for remote intelligence/MCP endpoints:
# fetch+cache a bearer token from a token endpoint, refresh on expiry. Dependency-free — reuses the hand-rolled HTTP client + serde_json + the
# sec::secret resolver; the form encoder is hand-rolled (no url/form_urlencoded
# crate). Rides `tls` for an https token endpoint (the common case).
oauth = []
# The GUARDED local command runner behind the `exec` tool.
# Default-OFF and cuts against the "no local execution" posture, so it
# is opt-in at BUILD time (this feature) AND at RUN time (security.exec.enabled)
# — without both, `exec` is a mapping-only contract (delegate off-box). Dep-free
# (std::process). Never in the default binary.
exec = []
# Hand-written Prometheus text on the opt-in HTTP/socket surface (no dep).
metrics = []
# Restart-free reconfiguration: a SIGHUP-triggered, validate-first,
# quiesce-and-reapply hot reload of the reloadable config subset (the paths
# `config::settings::RELOADABLE_PATHS` lists), gated at a reactive quiesce
# boundary. Dependency-free — raw `libc::sigaction` + the existing self-pipe (no
# signal-hook), reusing the one `config::settings::load` validation pipeline.
# SIGHUP keeps its default disposition when this feature is OFF. `mcp.servers`
# is RELOADABLE: a validated reload applies the MCP server set live — a removed
# server is disconnected, an added or changed one is (re)connected, and one
# whose spec is unchanged is left alone. The name-keyed server wiring makes that
# safe (a remove/add never shifts another server's identity).
hot-reload = []
# The inotify file-watch reload trigger: a `--watch-config`-armed
# raw `inotify` watch on the config file's PARENT DIRECTORY that sets the SAME
# RELOAD latch SIGHUP does, so a Kubernetes ConfigMap volume swap (an atomic
# directory-symlink rename) reloads with no signal plumbing. Implies `hot-reload`
# — the watch is useless without the reload routine it funnels into. Off by
# default (SIGHUP is the portable, dependency-free default). Dependency-free: raw
# `libc` inotify syscalls (no `notify`/`inotify` crate — the minimalism moat).
config-watch = ["hot-reload"]
# OTLP span export + GenAI semconv. Hand-rolled OTLP-over-HTTP/JSON over the
# existing HTTP client + serde_json — no opentelemetry/protobuf deps, so
# `--features otel` stays dependency-free (3 deps).
otel = []
# Test scaffolding the test + conformance suites drive — mock MCP servers (the
# hidden `--internal-mock-mcp` re-exec mode), crash points — never a shippable
# capability, so it's OFF in release and the production binary carries none of
# it. It includes `mock-models`, which the release ships on its own. Debug builds enable it automatically (the
# `debug_assertions` cfg on the modules), so `cargo test` and the conformance
# harness need no extra flag; an explicit `--release` test build can opt in here.
internal-mocks = ["mock-models"]
# The built-in mock model endpoint (`mock:final`, `mock:file:<playbook>`):
# scripted chat and decision answers, for trying and testing an agent or a
# workflow without a model provider. Shipped in the release binaries; the
# rest of `internal-mocks` (mock MCP servers, crash points) is not.
mock-models = []
# CEL (Common Expression Language) for workflows: `{"op":"cel"}` predicates,
# computed `assign.expr`, `infer.check` value constraints, and reactive `cel`
# wake conditions — hermetic, non-Turing-complete, terminating expressions the
# model can safely author. Off in the DEFAULT build, but IN the release feature
# set: `when`/`until`/`filter` are how a workflow branches, and a published
# binary that refused them at validation would make every non-trivial config a
# build-from-source job. A non-cel build still REJECTS workflows using CEL at
# define time (fail-closed, clear message). Costs ~1.8 MiB.
cel = ["dep:cel-interpreter"]
# AAuth [DRAFT] — agent-side auth for calling AAuth-protected MCP servers:
# an Ed25519 agent identity, an Agent-Provider token client
# (enroll + agent-token cache/refresh), and RFC 9421 HTTP Message Signatures on
# every outbound MCP request. Rides `tls` (the token/enroll dials are https).
# `ring` is ALREADY in the tree (rustls's crypto provider), so this adds a
# direct edge, not a new crate — the crypto exception, like `cel` is the
# expression exception. OFF by default; a non-aauth binary carries none of it.
aauth = ["tls", "dep:ring"]
# Instruction attestation — §7 of the Instruction Specification: JWS compact
# Ed25519 signatures over a document's authored/delivered digest, the
# resolution manifest, and the trust-ladder ceiling. Reuses AAuth's Ed25519 +
# base64url — the SAME `ring` rustls already resolves, no new crate — so it
# rides `aauth`. The digests and the manifest themselves are not behind it:
# instruction-core computes them in every build. OFF by default; a binary
# that never verifies signed documents carries no signature verification.
sign = ["aauth", "instruction-core/sign"]
# Instruction documents from an OCI artifact registry (RFC 0040): pull
# `oci://registry/repo:tag[@sha256:…]` over the Distribution API v2 — token
# dance, manifest + blob digest verification, docker-config static creds.
# Plain HTTPS + JSON on the existing client; SHA-256 is the `ring` rustls
# already resolves — no OCI client crate (the minimalism moat). OFF by default.
oci = ["tls", "dep:ring"]
# MCP Events (RFC 0045, SEP-3415 — a draft extension): `mcp.servers[].events`
# bindings and `event_grants`, polled into declared streams. Hand-rolled on the
# MCP socket; adds no dependency.
mcp-events = []
# On-the-fly decryption of encrypted instruction envelopes (RFC 0041): age v1
# (X25519 + scrypt passphrase) and JWE Compact (ECDH-ES, dir; A256GCM/A128GCM).
# AEADs/HKDF/HMAC/PBKDF2 are the `ring` already present; the X25519 ladder and
# scrypt's Salsa20/8 core are hand-rolled per their RFCs (ring's agreement API
# cannot import a static recipient key). Rides `sign` — an encrypted document
# is usually also a signed one. OFF by default.
decrypt = ["sign"]

[dependencies]
# The A2A protocol itself (feature `a2a`), from the A2A project's official Rust
# SDK: `a2a` the specification's types, `a2a-pb` the canonical ProtoJSON every
# binding puts on the wire (a type's serde form is not it — the SDK transcodes
# through protobuf), `a2a-server` the JSON-RPC router agentd's `RequestHandler`
# serves behind. agentd implements the handler; it does not re-implement the
# protocol.
#
# `a2a-server`'s default `rustls-tls` is off: agentd terminates TLS itself
# (that is where mTLS identity is read) and delivers push notifications over
# its own credentialed, SSRF-guarded transport (`a2a::push`), so neither the
# SDK's TLS listener nor its push sender is used.
# Named `a2a-types` here because the SDK's library is called `a2a`, which is
# also agentd's own `crate::a2a` module.
a2a-types = { package = "a2a-lf", version = "0.4.1", optional = true }
# The SDK's types carry instants as `chrono::DateTime<Utc>`.
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
a2a-pb = { version = "0.3.1", optional = true }
a2a-server = { package = "a2a-server-lf", version = "0.5.1", optional = true, default-features = false }
# The async runtime + HTTP server the A2A listener runs on (feature `a2a`).
# The SDK's JSON-RPC router is an axum `Router`, so agentd serves it directly
# and merges its own routes onto the same listener.
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1", optional = true, features = ["server", "tokio"] }
tower = { version = "0.5", optional = true, default-features = false }
# The SDK's `RequestHandler` is `#[async_trait]`; implementing it needs the
# same macro.
async-trait = { version = "0.1", optional = true }
# A channel receiver as a `Stream`, for the observation feed's SSE response.
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
cel-interpreter = { version = "0.10.0", optional = true, features = ["json"] }
# AAuth [DRAFT] crypto (feature `aauth`): Ed25519 keygen/sign + SHA-256. Pinned
# to the SAME ring rustls already resolves (no new crate in the graph). The
# `less-safe-getrandom-custom-or-rdrand` avoidance is default; std rng is used.
ring = { version = "0.17", optional = true }
# The reusable MCP base library (workspace crate): the client, wire types and the
# JSON-RPC codec. In-tree.
mcp = { package = "agentd-mcp", path = "../mcp", version = "4.0.0" }
# Shared transport primitives (workspace crate): the HTTP/1.1+SSE client, unix +
# feature-gated tls connects, SSRF guard. Owns the rustls/webpki deps
# (agentd's `tls` feature maps to `net/tls`).
net = { package = "agentd-net", path = "../net", version = "2.0.0" }
# The one non-negotiable dependency: JSON is the MCP + LLM wire format.
# Keep all wire types in one module (json/, wire/) so a swap to miniserde
# stays mechanical (rfcs/0002).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Instruction Specification reference implementation, extracted (C-01) so
# the platform and agentd run the SAME parser/validator/delivery code.
# `config::idoc` and `config::yaml` re-export it; behaviour is unchanged.
instruction-core = { package = "agentd-instruction", path = "../instruction", version = "0.3.0" }

# --- feature: cron --- hand-rolled in triggers/timer.rs; no dependency.

# Unix-only: signals (sigaction), process control (setpgid/killpg/waitpid),
# prctl (PR_SET_CHILD_SUBREAPER / PR_SET_PDEATHSIG), setrlimit. Raw libc —
# no signal-hook, no nix in the default build (rfcs/0002, rfcs/0003).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Unix-only test helper: send SIGTERM to a spawned agent to exercise the
# graceful-drain → exit-0 contract for the long-lived (loop/schedule/reactive)
# modes. `libc` is already a runtime dependency on Unix; this adds no new crate.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
