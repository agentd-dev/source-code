# instruction-core — the reference implementation of the Instruction
# Specification (https://github.com/instruction-md/specification) as a
# reusable library: parser → block tree, validator, the §3.5 delivery
# pipeline (byte-exact), and §7 signature verification, all driven by the
# spec's own vendored `instruction.schema.json`.
#
# Extracted from agentd (which remains its first consumer, via a re-export
# shim, with zero behaviour change) so the platform — publish-time
# validation, resolved reads, a TypeScript twin sharing one fixture corpus —
# consumes the same code agentd runs. Dependency posture matches agentd's
# moat: serde + serde_json only; `ring` (already resolved by any TLS
# consumer) appears only behind the `sign` feature for digests + Ed25519
# verification.
#
# Published to crates.io, because a published crate cannot depend on an
# unpublished one: agentd-core embeds this parser, so agentd-core and
# agentd-cli are unpublishable while this is path-only.
#
# LICENCE: `MIT OR Apache-2.0` from 0.2.0, the Rust ecosystem default —
# NOT the AGPL the rest of this workspace carries. That is deliberate and it
# is what makes the crate integrable: the reference implementation of an open
# specification is only useful if the other implementations of that
# specification can link it, and a copyleft parser forces every consumer to
# reimplement the spec instead — which is exactly the duplication this crate
# exists to end. agentd itself stays AGPL-3.0-only; a permissive dependency
# does not weaken that.
#
# 0.1.0 was published AGPL-3.0-only and stays that way forever — crates.io
# versions are immutable, so the relicence lives on 0.2.0 onward.
#
# THIRD-PARTY CONTENT (see ../../NOTICE): this crate vendors two artifacts from
# the Instruction Specification — `src/instruction.schema.json` (CC BY 4.0,
# read as data) and `tests/conformance/**` (Apache-2.0, test input, with the
# upstream LICENSE alongside). Relevant to any decision about publishing or
# relicensing this crate: both permit redistribution with attribution, which
# NOTICE provides.
[package]
# `agentd-instruction` rather than `instruction-core`: this crate implements a
# specification instruction.md OWNS, and a crates.io name is permanent (a yank
# hides a version, never the name). Taking `instruction-*` in an agentd release
# would stake a claim on their namespace; the lib is still `instruction_core`,
# the same package-vs-lib split agentd-core/`agentd` already uses.
name = "agentd-instruction"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Reference implementation of the Instruction Specification: parser, validator, delivery pipeline, and signature verification"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentd-dev/source-code"

[lib]
name = "instruction_core"
path = "src/lib.rs"

[features]
default = []
# §7 digests (sha256:<hex>) + JWS/Ed25519 signature verification, and the
# digest fields of the resolution manifest. Off = the manifest carries empty
# digest strings and verify is unavailable.
sign = ["dep:ring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3"
