# The reusable Model Context Protocol base library: wire types + the version/era
# model + (progressively) the transport dialects, client, and server that agentd's
# runtime builds on. Deliberately free of agentd internals so it can be reused and
# so the multi-version (legacy handshake ↔ modern stateless) logic lives in one
# place. Dependency budget mirrors agentd: serde + serde_json only.
[package]
name = "agentd-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Model Context Protocol base library: wire types, version/era negotiation, transports"
license = "Apache-2.0"
repository = "https://github.com/agentd-dev/source-code"
keywords = ["mcp", "json-rpc", "agent", "llm", "protocol"]
categories = ["network-programming", "api-bindings"]

[lib]
name = "mcp"
path = "src/lib.rs"

[features]
default = []
# Direct https:// MCP (TCP+TLS) + mutual-TLS client identities — maps to net/tls.
tls = ["net/tls"]
# AF_VSOCK MCP transport — maps to net/vsock for the client (outbound connect) and
# pulls the `vsock` crate directly for the server's inbound `VsockListener`.
vsock = ["net/vsock", "dep:vsock"]

[dependencies]
# Shared transport primitives (the HTTP/1.1+SSE client, unix/tls/vsock connects).
net = { package = "agentd-net", path = "../net", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The served-MCP vsock listener (`server::ServeStream::Vsock`). The client's vsock
# *connect* lives in `net`; the server *listens*, so it needs `VsockListener` here.
vsock = { version = "0.5", optional = true }
# The OFFICIAL MCP SDK — the client, not an alternative to one. `default-features
# = false` keeps the server half, the macro crate and reqwest out; the transport
# is agentd's own (`rmcp_transport`), which is how request signing and mTLS
# survive the adoption.
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "client-side-sse",
    "transport-streamable-http-client",
    "elicitation",
] }
# The SDK's transport is generic over an HTTP client; agentd supplies its own
# (`rmcp_transport`), so these are the pieces that seam needs: the SSE event type
# it yields, stream combinators, a channel-as-stream, and an error type.
sse-stream = { version = "0.2" }
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1" }
thiserror = { version = "2" }
# rmcp is async; the facade owns a private runtime so the rest of agentd stays
# blocking. Multi-threaded on purpose — see `rmcp_client::connect`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
# Header types for the transport's custom-header map (already in rmcp's tree).
http = { version = "1" }
