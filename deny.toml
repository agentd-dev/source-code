# cargo-deny: the minimalism + supply-chain gate (RFC 0002, assessment §4 M7).
# `cargo deny check` enforces: no security advisories, no wildcard deps, and an
# explicit license allow-list — so an "unearned" or unvetted dependency cannot
# slip in unnoticed.

# What it judges is the graph the release SHIPS: the workspace with its default
# features (`tls`) plus release.yml's FEATURES, exactly. A dependency that only
# a shipped feature brings in is a dependency the release carries, so a gate
# over the default graph alone would let it in unseen. release_matrix.rs holds
# this list to release.yml's, so the two cannot drift.
[graph]
features = ["a2a", "metrics", "cron", "otel", "hot-reload", "config-watch", "aauth", "oauth", "cel", "sign", "oci", "decrypt"]

[advisories]
version = 2
yanked = "deny"
# Each ignore carries its reason and the condition that ends it; nothing else
# is waived.
ignore = [
    # `paste` is unmaintained, not vulnerable: no advisory names a flaw in it.
    # It is a compile-time proc-macro (nothing of it runs in the binary) that
    # arrives only through cel-interpreter, the `cel` feature's one crate.
    # Drop this when cel-interpreter moves off paste.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time proc-macro pulled in by cel-interpreter; no known vulnerability" },
]

[bans]
# A wildcard version requirement is unpinned supply-chain risk.
wildcards = "deny"
# Several versions of one crate bloat the tree; warn (build-time proc-macro
# graphs sometimes legitimately diverge).
multiple-versions = "warn"

[licenses]
version = 2
# Permissive-only. Adding a license here is a deliberate act — it documents
# exactly what licences the (tiny) dependency set carries.
# Exactly the licences the dependency set `cargo deny check` walks carries
# (the shipped graph, [graph] above) — verified by `cargo deny check
# licenses` reporting no unmatched allowance.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # Permissive and MIT-style (the OpenBSD licence). The rustls stack's
    # crypto carries it: ring ("Apache-2.0 AND ISC"), rustls-webpki and
    # untrusted.
    "ISC",
    "Unicode-3.0",
    # Permissive (the zlib licence: use, alter and redistribute, keep the
    # notice). Only the shipped `a2a` graph carries it: foldhash (the hasher
    # of buffa and its hashbrown) and zlib-rs (the pure-Rust deflate behind
    # connectrpc's flate2).
    "Zlib",
    "CDLA-Permissive-2.0",
]
# agentd's own licence is not a dependency policy: AGPL-3.0-only applies to
# agentd itself, so it is excepted for these workspace crates BY NAME rather
# than allowed — an allow-list entry would let an AGPL dependency in unseen.
# agentd-instruction is MIT OR Apache-2.0 and needs no exception.
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "agentd-core" },
    { allow = ["AGPL-3.0-only"], crate = "agentd-cli" },
    { allow = ["AGPL-3.0-only"], crate = "agentd-mcp" },
    { allow = ["AGPL-3.0-only"], crate = "agentd-net" },
    { allow = ["AGPL-3.0-only"], crate = "agentd-conformance" },
]
