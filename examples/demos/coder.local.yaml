# Rehearsal layer for demo (d): the handbook from a local file, served by the
# registry stand-in (standins/registry.mjs, on 127.0.0.1:8733) instead of the
# mirror. Layer it over coder.yaml:
#
#   export REPO=/path/to/a/copy/of/engineering-fixture
#   agentd -c examples/demos/coder.yaml -c examples/demos/coder.local.yaml \
#     --intelligence mock:file:examples/demos/mock/coder.json --intelligence-token ""
#
# The server list is restated with `instruction-md` pointing at the stand-in
# (no sign-in), and the stand-in is catalogued for egress: closed. The local
# copies of the handbook (instruction/payments-handbook-v1.md, -v2.md) are
# the demo handbook without and with the test rule. Releasing v2 is
# copying -v2.md over the served file.

mcp:
  servers:
    - name: instruction-md
      endpoint: "${REGISTRY_MCP_URL:-http://127.0.0.1:8733/mcp}"
      # agentd's, not the model's: none of its tools is offered (coder.yaml).
      allow: []
      tags: {"*": [trusted]}

services:
  registry-standin: {kind: mcp, endpoint: "${REGISTRY_MCP_URL:-http://127.0.0.1:8733/mcp}"}
