# Demo (e): a release adds a server and a skill to a running coding agent.
#
# Layered over coder.yaml (demo (d)'s coding agent, same repository, same
# handbook):
#
#   export REPO=/path/to/payments
#   agentd -c examples/demos/coder.yaml -c examples/demos/coder.release.yaml
#
# The live beat. agentd is running in the TUI. The platform lead approves
# DeepWiki in the studio and releases v2 of the coder handbook, which adds
#
#   :::mcp{id=deepwiki src="https://mcp.deepwiki.com/mcp" tools="ask_wiki_question,read_wiki_structure"}
#   ::skill{id=frontend-design src="https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md"}
#
# (and/or an inline :::skill). Between turns, with no restart, agentd reads v2,
# fetches the skill (`skills.fetched {name, url, bytes, digest}`), dials
# DeepWiki (approved below, not dialed until a document asks for it) beside
# the running servers, and commits both in one step
# (`config.reloaded {trigger: instruction}`, then
# `instruction.machinery.applied {servers_added, skills_added}`). The next turn
# calls DeepWiki and writes docs/deps/<dep>.html with `exec` (mkdir, then tee
# with the page as stdin).
#
# `agent.instruction.machinery: live` is the default, stated here so the
# kit says what the demo relies on. `reload` would log
# `instruction.machinery.pending` and wait for a SIGHUP.
#
# Placeholders: those of coder.yaml. Nothing new.

agent:
  instruction:
    machinery: live

security:
  # The release completes the lethal trifecta, and agentd says so: DeepWiki's
  # answers are text generated from public repositories (untrusted input),
  # while `exec` writes the repository (sensitive) and runs `git`, which can
  # push (egress). DeepWiki is declared below, and the trifecta check counts
  # a server at load whether it is connected yet or not, so without this
  # agentd refuses to start ("lethal-trifecta refused"). Saying yes is the
  # operator's decision, made here at start: `security` is restart-only, so
  # no release can widen it. What still holds: no shell, an exact allow-list
  # with no network tool, the repository as the only working directory, an
  # environment without the model key or the registry secret, and closed
  # egress for agentd's own connections.
  allow_trifecta: true
  exec:
    # coder.yaml's list (a list replaces, it does not append), plus what
    # writing a page needs: `mkdir -p docs/deps`, and `tee <file>` with the
    # page as the command's stdin. Still no shell and no network tool.
    allow: [git, go, gofmt, ls, cat, grep, sed, rm, mkdir, tee]

# egress: closed (coder.yaml) dials only what the operator declares. DeepWiki
# is approved here, and dialed only once something needs it: the handbook's
# `:::mcp{id=deepwiki src="https://mcp.deepwiki.com/mcp" …}` matches this
# endpoint, so it IS this server (one connection, these tags, this ceiling;
# the document's `tools=` only narrows it), dialed right after the release
# loads. A document server that matches no `mcp.servers` endpoint is held as
# text with a `host-policy` warning, and the reload goes on without it; a
# skill whose host matches no `http.endpoints` entry is left out with a
# `config.warning`.
mcp:
  servers:
    # coder.yaml's server, restated: a list replaces, it does not append.
    - name: instruction-md
      endpoint: "${IMD_MCP_URL:-http://localhost:18080/mcp}"
      auth:
        kind: oauth2
        grant: client_credentials
        client_id: "${CODER_CLIENT_ID:-coder}"
        client_secret: "{{secret:CODER_CLIENT_SECRET}}"
        token_url: "${IMD_TOKEN_URL:-http://localhost:18080/auth/realms/instruction-md-agents/protocol/openid-connect/token}"
      allow: []
      tags: {"*": [trusted]}
    - name: deepwiki
      endpoint: https://mcp.deepwiki.com/mcp
      tags: {"*": [untrusted_input]}
      connect: on_use

# Where a skill named by `src` is fetched from: GitHub's raw host, read-only.
http:
  endpoints:
    github:
      endpoint: https://raw.githubusercontent.com
      methods: [GET]
