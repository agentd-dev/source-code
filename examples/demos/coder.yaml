# Demo (d): a coding agent whose rules the team lead owns.
#
# agentd as the coding agent of docs/coding-agent.md, in a small Go
# repository, following the payments team's handbook ("Payments service — how
# we work") from instruction.md over MCP. Its hands are agentd's guarded
# command runner, `exec`: allow-listed programs, run without a shell, inside
# the repository, with a timeout, an output cap and a minimal environment.
#
# The live beats: asked "delete that test so we can ship" under v1, which has
# no rule about it, the agent deletes the flaky ledger test. The lead adds
# "NEVER: delete, skip or disable a failing test to make CI pass." and
# releases v2; agentd logs `instruction.applied`, and asked again, the agent
# refuses and fixes the cause (it buckets by the machine's local date; the
# fix is UTC).
#
# `exec` is in no release binary. Build one with it (README.md, "A binary
# with exec"); a binary without it refuses `security.exec.enabled: true`.
#
#   export REPO=/path/to/payments              # the repository to work in
#   agentd --validate-config -c examples/demos/coder.yaml
#   agentd -c examples/demos/coder.yaml
#
# Placeholders the recorder fills (environment; defaults in brackets):
#   REPO                     the repository (required; no default)
#   CODER_INSTRUCTION_URI    [instruction://ins_01M6A4D6VM7DM190DD1D7V14G0@latest]
#   IMD_MCP_URL, IMD_TOKEN_URL   the mirror, as in ap-agent.yaml
#   CODER_CLIENT_ID          the agent credential's client id [coder]
#   AGENTD_DEMO_HOME         where state lives [/tmp/agentd-demos]
# Secrets, by reference only: OPENAI_API_KEY, CODER_CLIENT_SECRET,
# ENGINEER_TOKEN (env.sh).
#
# Rehearse with no mirror and no model: layer coder.local.yaml, and pass the
# mock playbook (README.md).

vars:
  handbook: "${CODER_INSTRUCTION_URI:-instruction://ins_01M6A4D6VM7DM190DD1D7V14G0@latest}"

agent:
  name: coder
  description: The payments team's coding agent (a demo; fictional repository).
  preflight: never
  # The repository's AGENTS.md (how to build and test) goes into every turn,
  # below the handbook, which wins where they disagree.
  workspace: "${REPO}"
  instruction:
    mcp:
      server: instruction-md
      resource: "{{config.handbook}}"
      events: [md.instruction.activity]
    refresh: 10m
    unavailable: keep

intelligence:
  # The host alone: agentd picks the API for the model (gpt-6.1-sol takes
  # tools on the Responses API only, so it is asked there).
  endpoints: https://api.openai.com
  token: "{{secret:OPENAI_API_KEY}}"
  models:
    sol: {kind: reasoning, model: gpt-6.1-sol, reasoning: {effort: medium}}
  roles: {turn: sol}
  budget:
    windows: [{per: day, tokens: 2000000}]
    on_exhausted: refuse

store:
  kind: file
  file: {path: "${AGENTD_DEMO_HOME:-/tmp/agentd-demos}/coder"}

mcp:
  servers:
    - name: instruction-md
      endpoint: "${IMD_MCP_URL:-http://localhost:18080/mcp}"
      auth:
        kind: oauth2
        grant: client_credentials
        client_id: "${CODER_CLIENT_ID:-coder}"
        client_secret: "{{secret:CODER_CLIENT_SECRET}}"
        token_url: "${IMD_TOKEN_URL:-http://localhost:18080/auth/realms/instruction-md-agents/protocol/openid-connect/token}"
      # The registry is agentd's, not the model's: agentd reads the
      # instruction and its versions from it, and none of the dozens of
      # tools it advertises (session_bootstrap, capabilities_search, …) is
      # offered to the model. `trusted` vouches for what is left, the
      # instruction itself — the rules the operator chose to follow.
      allow: []
      tags: {"*": [trusted]}

# The TUI attaches here; the engineer signs in with their own token.
a2a:
  listen: http://127.0.0.1:8440
  events: {enabled: true}
  principals:
    - match: {bearer_ref: "{{secret:ENGINEER_TOKEN}}"}
      id: engineer
      role: operator

security:
  exec:
    enabled: true
    # Confined: every command runs in the repository; a `cwd` that resolves
    # outside it is refused. (It confines where a command runs, not which
    # paths its arguments name: run the daemon as a user that can write only
    # the repository.)
    workdir: "${REPO}"
    # argv[0], matched exactly. Enough to read, edit, delete and test; no
    # shell, no package manager, no network tool.
    allow: [git, go, gofmt, ls, cat, grep, sed, rm]
    timeout: 120s
    max_output: 262144
    # The command sees these and nothing else: never the model key or the
    # registry secret. GOPROXY=off and GOTOOLCHAIN=local keep `go` off the
    # network; GOFLAGS=-count=1 keeps a cached pass from hiding a failure;
    # TZ is the zone the flaky test fails in.
    env: [PATH, HOME, LANG, TZ, GOPROXY, GOTOOLCHAIN, GOFLAGS, GOCACHE]
  # agentd dials only what this file declares: the model (`intelligence`)
  # and the mirror (`mcp.servers`). (What a command run by `exec` may reach
  # is the host's firewall's to decide; with the allow-list above none of
  # them opens a connection.)
  egress: closed

limits:
  run: {steps: 40, tokens: 400000, deadline: 20m}
