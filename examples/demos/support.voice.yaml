# Demo (c), the voice channel: a layer over support.yaml.
#
#   agentd -c examples/demos/support.yaml -c examples/demos/support.voice.yaml
#
# Its own name, listener and state, and its own agent credential at the
# registry (voice-agent). The server list is restated because a layer's list
# replaces the base's; everything else — the instruction, its pin, the model,
# the principals — is support.yaml's.

agent:
  name: support-voice
  description: Harbor Bank customer support, voice channel (a demo; fictional data).

store:
  file: {path: "${AGENTD_DEMO_HOME:-/tmp/agentd-demos}/support-voice"}

mcp:
  servers:
    - name: instruction-md
      endpoint: "${IMD_MCP_URL:-http://localhost:18080/mcp}"
      auth:
        kind: oauth2
        grant: client_credentials
        client_id: "${VOICE_AGENT_CLIENT_ID:-voice-agent}"
        client_secret: "{{secret:VOICE_AGENT_CLIENT_SECRET}}"
        token_url: "${IMD_TOKEN_URL:-http://localhost:18080/auth/realms/instruction-md-agents/protocol/openid-connect/token}"
      tags: {"*": [trusted]}

a2a:
  listen: http://127.0.0.1:8431
