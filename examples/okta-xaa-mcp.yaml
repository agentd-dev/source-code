# agentd acting for each person who signs in through the organization's IdP
# — Okta's Cross App Access here — at an MCP server that trusts it
# (Enterprise-Managed Authorization, RFC 0044). The config behind
# docs/authentication.md#enterprise-managed-authorization.
#
#   cargo build --release --features a2a,xaa     # xaa is NOT in release binaries
#   export OPENAI_API_KEY=sk-…
#   agentd --config examples/okta-xaa-mcp.yaml
#
# People sign in from a display client — `agentd-tui --endpoint
# http://127.0.0.1:8420 --login idp`, or the web UI's "sign in with your
# organization" — and that sign-in is their enrolment: their runs act at
# Linear as them, and only them. A laptop approved through the device grant
# as `alice-laptop` delegates as the one identity its pin names, once its own
# session has signed in at the IdP. The operator's bearer approves device
# codes and offboards people; it never acts as anyone.
#
# What a person sends from their own session is theirs: it is no outside
# text to their own work. What Linear answers is (anyone can write an
# issue), so after a read every later Linear call in the run asks them
# first; and every Linear tool is tagged egress, so each one's first use in
# a run — a read's too — asks them. The team chat is agentd's own server: people's
# work may post to it — their template lists it — and its first post in a
# run asks them, by the operator's rule below.
#
# Every Monday the weekly summary runs for Alice with nobody there: each
# firing asks her to approve it on her phone (Okta CIBA, which needs an Okta
# Custom Authenticator), and reads her Linear issues with that approval
# alone. She consented to the workflow as it is when she last signed in; an
# edit to it suspends its firings until she signs in again. A grant revoked
# mid-run makes a Linear step wait for its person to sign in again
# (`on_revoked: ask`) rather than fail.
#
# The keys are files the deployment mounts under /run/agentd/ — never the
# environment, which agentd refuses for a delegation key. On a host other than
# this one, listen on https:// with `a2a.url` and `a2a.tls`. Several people
# hold grants here, so the kernel must have Landlock — or workers run as
# `spawn.uid`, with the keys and the store closed to that uid.

agent:
  name: assistant
  instruction: |
    You help each person with their Linear issues, acting as them. Before
    you call Linear, say what you will do: agentd asks them to approve the
    calls it makes as them, in their own display client.
  preflight: never

intelligence:
  endpoints: https://api.openai.com/v1/chat/completions
  model: gpt-5.1
  token: "{{secret:OPENAI_API_KEY}}"

a2a:
  listen: "http://127.0.0.1:8420"
  # The operator: approves device codes, revokes and forgets people.
  bearer: "{{secret-file:/run/agentd/operator-token}}"
  # Each person signs in at the IdP from a display client.
  login: {idp: okta, token_ttl: 8h}
  # A device whose name a pin binds to one person.
  device_grant: {enabled: true}

security:
  experimental: {id_jag: true}
  policies:
    # A person's work posting with agentd's own credential asks them, at its
    # first post in each run.
    - match: {mode: delegated, delegated: false, any_tags: [egress]}
      action: ask
      to: principal
      once_per: run_tool

identity:
  providers:
    okta:
      issuer: https://acme.okta.com
      profile: okta
      client_id: 0oa9agentdXAA
      client_auth:
        method: private_key_jwt
        key: "{{secret-file:/run/agentd/okta-agent-key.pem}}"
        kid: agentd-2026-10
      sign_in: {grants: [authorization_code, device], scopes: [openid, offline_access]}
      # How a firing asks its person on their own device; Okta polls only.
      ciba: {enabled: true, request_expiry: 300s, per_day: 4}
  delegation:
    seal_key: "{{secret-file:/run/agentd/delegation-seal}}"
    # A gate is approved from a session whose own IdP sign-in is this recent.
    consent_session_max_age: 8h
    # At most this many gates a minute for one person; past it, refused.
    consent_per_minute: 6
    device_pins:
      alice-laptop: {iss: https://acme.okta.com, sub: 00u1alice}
    templates:
      - name: people
        principals: {source: oidc}
        idp: okta
        servers:
          linear: {scopes: ["issues:read", "issues:write"]}
        # An agent-mode server tagged egress stays hidden from people's work
        # unless listed here.
        agent_mode_servers: [team-chat]
        budget: {per_minute: 4}
        # Firings of an act_for workflow naming one of these people may act
        # for them, each approved on their own device; none may write.
        unattended: ciba
      - name: laptops
        principals: {source: device}
        idp: okta
        servers:
          linear: {scopes: ["issues:read"]}

mcp:
  servers:
    - name: linear
      endpoint: https://mcp.linear.example/mcp
      tags: {"*": [sensitive, egress]}
      auth:
        kind: oauth2
        grant: id_jag
        idp: okta
        audience: https://auth.linear.example
        resource: https://mcp.linear.example/mcp
        client_id: agentd-at-linear
        client_auth:
          method: private_key_jwt
          key: "{{secret-file:/run/agentd/linear-ras-key.pem}}"
          kid: agentd-ras-1
        scopes: ["issues:read"]
        tool_scopes: {create_issue: ["issues:write"]}
        # A workflow step whose grant is gone waits for its person.
        on_revoked: ask
    - name: team-chat
      endpoint: https://chat-mcp.acme.example/mcp
      tags: {"*": [egress]}
      auth: {kind: static, token: "{{secret-file:/run/agentd/chat-token}}"}

workflows:
  - name: weekly-summary
    # Acts for Alice, her own IdP subject: only this configuration may say so.
    act_for:
      principal: {source: oidc, issuer: https://acme.okta.com, sub: 00u1alice}
      via: ciba
    concurrency: {max_runs: 1, on_overflow: drop}
    steps:
      tick: {kind: schedule, every: 168h}
      issues: {kind: mcp.tool, depends_on: [tick], server: linear, tool: list_issues, args: {}}
      done: {kind: finish, depends_on: [issues], output: "{{steps.issues.output}}"}
