# ─────────────────────────────────────────────────────────────────────────────
# finance — the finance desk. (Beacon — see README.md.)
#
# Stripe posts payment events. A failed payment starts a DUNNING run: polite
# reminder, durable 5-day sleep, second notice, 7 more days, then a human
# write-off gate — the whole sequence survives any restart because sleeps and
# human gates are durable. Sales fires `fin.invoice` on closed-won. Every
# money event lands on the `ledger` stream; the monthly close consumes the
# stream and mails the CEO a report (through the outbox).
#
# Trust legs: sensitive (the books). Stripe webhooks are HMAC-authenticated
# machine events, and all outbound mail goes through the outbox peer.
#
# ── What this desk needs to exist ────────────────────────────────────────────
#
# Services: Stripe (or any PSP with payment webhooks) and a billing/ledger
# system an MCP server can wrap (Stripe itself doubles as one for
# invoices+subscriptions; add your accounting tool for the books).
#
# Secrets:
#   OPENAI_API_KEY        — the model.
#   (MCP endpoints, credentials, tags and tool ceilings for this desk live in
#   services.yaml — the shared catalog. Launch: agentd -c services.yaml -c finance.yaml)
#   STRIPE_WEBHOOK_SECRET — ⚠ the one integration nuance in this file:
#                           Stripe's real Stripe-Signature header is
#                           `t=<ts>,v1=HMAC(ts + "." + body)` — a scheme
#                           agentd's generic raw-body HMAC cannot verify
#                           directly. Terminate Stripe's scheme at a thin
#                           relay (20 lines, or your gateway's transform)
#                           that verifies v1 and re-signs the raw body as
#                           plain sha256 HMAC into the same header — the
#                           value HERE is the RELAY's secret. Twilio's
#                           URL-based HMAC-SHA1 (support-l1) needs the same
#                           treatment; GitHub's (engineering) does not.
#
# MCP contract — `ledger` server: get/create invoice, get payment status,
# create ledger entry (write-off, note), pause/resume subscription, monthly
# aggregates for the close. Nuances: EVERY write is idempotent by an
# external key (the step's env.idempotency_key exists for this); amounts
# are integer cents end-to-end — never floats, and the instruction's
# "never round" leans on the server not rounding either.
# ─────────────────────────────────────────────────────────────────────────────
config_version: "1"

agent:
  name: finance
  instruction: |
    You are Beacon's finance desk.

    Numbers are sacred: never round a ledger entry, never guess an amount —
    if a figure is missing, say so and stop. Dunning is firm but kind; a
    customer in a bad week is still a customer. Writing off revenue is the
    CEO's decision, never yours.
  ask_human_fallback: wait

intelligence:
  endpoints: https://api.openai.com/v1
  model: gpt-5.1
  token: "{{secret:OPENAI_API_KEY}}"
  budget:
    windows: [{ per: day, tokens: 1000000 }]
    on_exhausted: refuse

store:
  kind: file
  file: { path: /var/lib/agentd/startup/finance }

mcp:
  servers:
    # Billing + the books (read/write invoices, ledger entries, subscriptions).
    - { name: ledger, service: ledger }

webhooks:
  listen: http://127.0.0.1:9446
  default_auth:
    hmac:
      secret: "{{secret:STRIPE_WEBHOOK_SECRET}}"
      header: Stripe-Signature
      algo: sha256

a2a:
  listen: http://127.0.0.1:8446
  peers:
    - name: outbox
      endpoint: http://127.0.0.1:8447

interface:
  enabled: true

limits:
  max_runs: 20
  run: { steps: 40, tokens: 100000, deadline: 30d }

streams:
  ledger:
    retention: { max_events: 20000, max_age: 400d }

workflows:
  # ── A payment failed: dunning, durably ────────────────────────────────────
  - name: dunning
    concurrency: { max_runs: 10, on_overflow: queue }
    steps:
      hook:
        kind: webhook
        path: /stripe/payment-failed
        methods: POST
        respond: { status: 202 }

      # Stripe's payload nests the invoice under data.object; the relay (see
      # header) may also flatten it. Model extraction absorbs either shape.
      # For a guaranteed-shape relay, swap `extract` for the zero-token
      # `validate` step and reference fields directly.
      case:
        kind: extract
        depends_on: hook
        input: "{{ steps.hook.output.body }}"
        output_schema:
          type: object
          required: [customer_id, email, amount, invoice_id]
          properties:
            customer_id: { type: string }
            email: { type: string }
            amount: { type: string }
            invoice_id: { type: string }

      remind1:
        kind: a2a.delegate
        depends_on: case
        peer: outbox
        command: outbox.email
        args:
          to: "{{ steps.case.output.email }}"
          subject: "Your Beacon payment did not go through"
          body: "Invoice {{ steps.case.output.invoice_id }} for {{ steps.case.output.amount }} failed to process. Your monitoring keeps running — please update your card in the billing portal when you have a minute."
          on_behalf_of: finance
        timeout: 10m
        idempotency: true

      # Durable: the process can restart, redeploy, or crash — the timer
      # holds and the run resumes here.
      wait1: { kind: sleep, depends_on: remind1, duration: 5d }

      check1:
        kind: agent
        depends_on: wait1
        servers: [ledger]
        instruction: |
          Did invoice {{ steps.case.output.invoice_id }} get paid since?
          Answer from the billing records only.
        output_schema:
          type: object
          required: [paid]
          properties: { paid: { type: boolean } }

      route1:
        kind: switch
        depends_on: check1
        on: "{{ steps.check1.output.paid }}"
        cases: { "true": recovered }
        default: remind2

      remind2:
        kind: a2a.delegate
        depends_on: route1
        peer: outbox
        command: outbox.email
        args:
          to: "{{ steps.case.output.email }}"
          subject: "Second notice — invoice {{ steps.case.output.invoice_id }}"
          body: "Our earlier note may have missed you: invoice {{ steps.case.output.invoice_id }} ({{ steps.case.output.amount }}) is still unpaid. Service pauses in 7 days if we cannot process it; reply here and a person will look at anything unusual."
          on_behalf_of: finance
        timeout: 10m
        idempotency: true

      wait2: { kind: sleep, depends_on: remind2, duration: 7d }

      check2:
        kind: agent
        depends_on: wait2
        servers: [ledger]
        instruction: |
          Final check: did invoice {{ steps.case.output.invoice_id }} get
          paid? Billing records only.
        output_schema:
          type: object
          required: [paid]
          properties: { paid: { type: boolean } }

      route2:
        kind: switch
        depends_on: check2
        on: "{{ steps.check2.output.paid }}"
        cases: { "true": recovered }
        default: writeoff_gate

      # Money is only ever abandoned by a person.
      writeoff_gate:
        kind: human
        depends_on: route2
        question: |
          Invoice {{ steps.case.output.invoice_id }}
          ({{ steps.case.output.amount }}, customer
          {{ steps.case.output.customer_id }}) is unpaid after two notices
          and 12 days. Write off and pause service, or keep chasing?
        schema:
          type: object
          required: [decision]
          properties: { decision: { enum: [write_off, keep_chasing] } }
        timeout: 4d

      settle:
        kind: agent
        depends_on: writeoff_gate
        servers: [ledger]
        instruction: |
          The CEO decided: {{ steps.writeoff_gate.output.decision }} for
          invoice {{ steps.case.output.invoice_id }}. Record it in the books
          exactly (write-off entry, or a note to keep the invoice open) and
          pause the subscription only on write_off.

      recovered:
        kind: agent
        depends_on: [route1, route2]
        servers: [ledger]
        instruction: |
          Invoice {{ steps.case.output.invoice_id }} recovered. Mark the
          dunning case closed in the books.

      record:
        kind: emit
        depends_on: [settle, recovered]
        stream: ledger
        subject: "dunning.closed"
        correlation: "{{ steps.case.output.invoice_id }}"
        data:
          customer: "{{ steps.case.output.customer_id }}"
          amount: "{{ steps.case.output.amount }}"

      fin: { kind: finish, depends_on: [record], status: completed }

  # ── A payment succeeded: book it ──────────────────────────────────────────
  - name: payment-in
    concurrency: { max_runs: 10 }
    steps:
      hook:
        kind: webhook
        path: /stripe/payment-succeeded
        methods: POST
        respond: { status: 202 }
      book:
        kind: emit
        depends_on: hook
        stream: ledger
        subject: "payment.received"
        correlation: "{{ steps.hook.output.body.invoice_id }}"
        data: "{{ steps.hook.output.body }}"
      fin: { kind: finish, depends_on: [book], status: completed }

  # ── Sales closed a deal: raise the invoice ────────────────────────────────
  - name: invoice
    steps:
      cmd:
        kind: a2a
        command: fin.invoice
        roles: [agent, operator]
        schema:
          type: object
          required: [lead, company, email, terms]
          properties:
            lead: { type: string }
            company: { type: string }
            email: { type: string }
            terms: { type: string }
      raise:
        kind: agent
        depends_on: cmd
        servers: [ledger]
        instruction: |
          Sales closed {{ steps.cmd.output.args.company }}
          ({{ steps.cmd.output.args.email }}) at terms:
          {{ steps.cmd.output.args.terms }}.
          Create the customer and the first invoice in billing, exactly as
          the terms state. If any figure is ambiguous, stop and say what is
          missing rather than inventing it.
      note:
        kind: emit
        depends_on: raise
        stream: ledger
        subject: "invoice.raised"
        data: { detail: "{{ steps.raise.output }}" }
      fin: { kind: finish, depends_on: [note], status: completed }

  # ── Monthly close: the stream IS the journal ──────────────────────────────
  # (The close reads billing via MCP for the numbers; the `ledger` stream is
  # the durable cross-check — every dunning outcome, payment and invoice
  # this desk ever saw, replayable. If the two disagree, THAT is the
  # finding, and it goes in the report.)
  # Everything the month produced replays through the report — including
  # events booked while this workflow did not exist yet.
  - name: monthly-close
    steps:
      wake: { kind: schedule, cron: "17 6 1 * *", tz: UTC }
      report:
        kind: agent
        depends_on: wake
        servers: [ledger]
        instruction: |
          Close the month: from the billing records, produce MRR, new
          revenue, churn, failed-payment recovery rate, and the three
          numbers the CEO should worry about. Plain prose, no adjectives.
      send:
        kind: a2a.delegate
        depends_on: report
        peer: outbox
        command: outbox.email
        args:
          to: "ceo@beacon.example"
          subject: "Monthly close"
          body: "{{ steps.report.output }}"
          on_behalf_of: finance
        timeout: 10m
        idempotency: true
      fin: { kind: finish, depends_on: [send], status: completed }

  # ── Gates never wait in silence ───────────────────────────────────────────
  # `human.asked` fires whenever ANY gate on this instance opens (the
  # write-off gate above included); this workflow turns it into an email, so
  # the CEO learns about a pending approval without watching a terminal.
  - name: gate-notifier
    concurrency: { max_runs: 4 }
    steps:
      saw: { kind: event, on: human.asked }
      mail:
        kind: a2a.delegate
        depends_on: saw
        peer: outbox
        command: outbox.email
        args:
          to: "ceo@beacon.example"
          subject: "Approval waiting on the finance desk"
          body: "A gate just opened: {{ steps.saw.output.payload.question }}"
          on_behalf_of: finance
        timeout: 10m
        idempotency: true
      fin: { kind: finish, depends_on: [mail], status: completed }
