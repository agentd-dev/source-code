# ─────────────────────────────────────────────────────────────────────────────
# sre — the on-call SRE. (Beacon — see README.md.)
#
# The monitoring stack posts alert webhooks. Firing alerts open an INCIDENT
# run: diagnose through the infra server, attempt the safe remediations,
# update the public status page, then park — durably — on a signal that the
# matching "resolved" webhook fires. If nothing resolves within the window,
# the CTO is woken (human step). Every incident lands on a durable stream;
# the postmortem desk consumes it and files follow-ups with engineering.
#
# Trust legs: sensitive (infra) + egress (the status page is public). No
# untrusted input: alerts come authenticated from OUR monitoring.
#
# ── What this desk needs to exist ────────────────────────────────────────────
#
# Services: a monitoring stack that webhooks on alert transitions
# (Alertmanager/Grafana both do), an infra control plane an MCP server can
# wrap (Kubernetes, Nomad, your PaaS API), a status page with an API
# (Instatus, Statuspage, or self-hosted).
#
# Secrets:
#   OPENAI_API_KEY       — the model.
#   INFRA_TOKEN          — the infra API credential. This is the most
#                          dangerous secret in the company: scope it to the
#                          verbs the `allow:` list names and NOTHING wider —
#                          the registry filter makes destructive tools
#                          absent, but a broad token behind a narrow filter
#                          is still a broad token if the server changes.
#   STATUSPAGE_TOKEN     — status-page API key (incident create/update/
#                          resolve on ONE page).
#   ALERT_WEBHOOK_SECRET — set the same value on the monitoring stack's
#                          webhook config. Alertmanager cannot sign; put
#                          this desk's routes behind your ingress and have
#                          it (or a 10-line relay) add the sha256-HMAC
#                          X-Alert-Signature header. Never expose an
#                          unsigned alert route: firing FAKE alerts at an
#                          agent that can restart services is an attack.
#
# MCP contract — `infra` server: read dashboards/metrics/deploys, plus the
# three safe verbs (restart_service, scale_pool, rollback_deploy). Nuances:
# the verbs MUST be idempotent (a crash-replayed restart is a restart);
# rollback should refuse when there is nothing newer than the last deploy;
# reads should return summaries, not raw metric series.
#
# MCP contract — `statuspage` server: create/update/resolve incident on the
# public page. Idempotent per incident id — the correlation id below is the
# alert id for exactly that reason.
# ─────────────────────────────────────────────────────────────────────────────
config_version: "2"

agent:
  name: sre
  instruction: |
    You are Beacon's SRE.

    Diagnose before you touch: read the alert, read the dashboards, say what
    you believe is wrong and why. Remediate with the SAFE set only — restart
    an unhealthy service, scale a pool, roll back the last deploy. Anything
    destructive (data, DNS, certificates) is the CTO's call: ask and wait.

    The status page is customers reading during an outage: update it early,
    in plain words, and close it honestly.
  ask_human_fallback: wait

intelligence:
  endpoints: https://api.openai.com/v1
  model: gpt-5.1
  token: "{{secret:OPENAI_API_KEY}}"
  budget:
    windows: [{ per: day, tokens: 3000000 }]
    on_exhausted: refuse

store:
  kind: file
  file: { path: /var/lib/agentd/startup/sre }

mcp:
  servers:
    # Dashboards + the safe remediation verbs (restart/scale/rollback).
    - name: infra
      endpoint: https://mcp.infra.beacon.example/mcp
      tags: { "*": [sensitive] }
      auth: { kind: static, token: "{{secret:INFRA_TOKEN}}" }
      # The safe set, enforced at the registry — destructive verbs are absent
      # from this instance, not merely discouraged by the instruction.
      allow: ["get_*", "list_*", "query_*", "restart_service", "scale_pool", "rollback_deploy"]
    - name: statuspage
      endpoint: https://mcp.statuspage.example/mcp
      tags: { "*": [egress] }
      auth: { kind: static, token: "{{secret:STATUSPAGE_TOKEN}}" }

webhooks:
  listen: http://127.0.0.1:9444
  default_auth:
    hmac:
      secret: "{{secret:ALERT_WEBHOOK_SECRET}}"
      header: X-Alert-Signature
      algo: sha256

a2a:
  listen: http://127.0.0.1:8444
  peers:
    - name: engineering
      endpoint: http://127.0.0.1:8442

interface:
  enabled: true

limits:
  max_runs: 10
  run: { steps: 50, tokens: 300000, deadline: 6h }

streams:
  incidents:
    retention: { max_events: 2000, max_age: 90d }

workflows:
  # ── An alert fired: open an incident ──────────────────────────────────────
  - name: incident
    concurrency: { max_runs: 4, on_overflow: queue }
    steps:
      # Alertmanager: point a webhook receiver's `url` here for FIRING
      # notifications and a second receiver at /alerts/resolved (below) —
      # or one route reading `status` if you prefer; two routes keep the
      # workflows honest. Group alerts per-service so one incident run maps
      # to one page entry, not forty.
      hook:
        kind: webhook
        path: /alerts/firing
        methods: POST
        respond: { status: 202 }

      alert:
        kind: extract
        depends_on: hook
        input: "{{ steps.hook.output.body }}"
        output_schema:
          type: object
          required: [alert_id, service, severity]
          properties:
            alert_id: { type: string }
            service: { type: string }
            severity: { enum: [warning, critical] }
            summary: { type: string }

      diagnose:
        kind: agent
        depends_on: alert
        servers: [infra]
        instruction: |
          Alert {{ steps.alert.output.alert_id }} is firing on
          {{ steps.alert.output.service }} ({{ steps.alert.output.severity }}):
          {{ steps.alert.output.summary }}

          Diagnose from the dashboards, then remediate with the safe verbs if
          a safe remediation applies. State: what you saw, what you did (or
          why nothing safe applied).

      inform:
        kind: agent
        depends_on: diagnose
        servers: [statuspage]
        instruction: |
          Post a status-page incident for {{ steps.alert.output.service }} in
          calm, plain customer language. Diagnosis so far:
          {{ steps.diagnose.output }}

      # Durable park: the resolved webhook (below) signals this exact alert.
      # A restart in mid-incident resumes the wait with its deadline intact.
      # The deadline is an EXPECTED branch: `on_timeout` routes to the
      # escalation tail; the success tail below stays untouched.
      resolved:
        kind: wait
        depends_on: inform
        on: signal
        signal: "resolved/{{ steps.alert.output.alert_id }}"
        timeout: 45m
        on_timeout: page_cto

      close:
        kind: agent
        depends_on: resolved
        servers: [statuspage]
        instruction: |
          The alert cleared: {{ steps.resolved.output.payload }}. Close the
          status-page incident for {{ steps.alert.output.service }} honestly.

      record:
        kind: emit
        depends_on: close
        stream: incidents
        subject: "incident.closed"
        correlation: "{{ steps.alert.output.alert_id }}"
        data:
          service: "{{ steps.alert.output.service }}"
          severity: "{{ steps.alert.output.severity }}"
          summary: "{{ steps.alert.output.summary }}"
          diagnosis: "{{ steps.diagnose.output }}"

      fin: { kind: finish, depends_on: [record], status: completed }

      # ── The escalation tail. Reached ONLY by `on_timeout` routing, so it
      # declares no dependencies: depending on the wait would also fire it
      # when the alert clears. The CTO's answer arrives through any attached
      # chat client; `human.asked` (see finance's gate-notifier pattern)
      # is how it ALSO reaches a phone. If the CTO is silent for the 2h
      # timeout too, the run fails — which run_until/alerting surfaces,
      # deliberately: a stuck incident must never fail SILENTLY.
      page_cto:
        kind: human
        question: |
          {{ steps.alert.output.service }} has been down 45+ minutes and my
          safe remediations did not clear alert
          {{ steps.alert.output.alert_id }}. Diagnosis:
          {{ steps.diagnose.output }} — how do you want to proceed?
        timeout: 2h

      close_manual:
        kind: agent
        depends_on: page_cto
        servers: [statuspage]
        instruction: |
          The CTO directed: {{ steps.page_cto.output }}. Update and close the
          status-page incident for {{ steps.alert.output.service }}
          accordingly.

      record_manual:
        kind: emit
        depends_on: close_manual
        stream: incidents
        subject: "incident.escalated"
        correlation: "{{ steps.alert.output.alert_id }}"
        data:
          service: "{{ steps.alert.output.service }}"
          severity: "{{ steps.alert.output.severity }}"
          summary: "{{ steps.alert.output.summary }}"
          diagnosis: "{{ steps.diagnose.output }}"

      fin_manual: { kind: finish, depends_on: [record_manual], status: completed }

  # ── The matching all-clear: the webhook IS the signal ─────────────────────
  # `signal:` on the start does the relay; the run is just the audit trail.
  - name: alert-resolved
    concurrency: { max_runs: 8 }
    steps:
      hook:
        kind: webhook
        path: /alerts/resolved
        methods: POST
        respond: { status: 202 }
        signal: "resolved/{{ body.alert_id }}"
      fin: { kind: finish, depends_on: [hook], status: completed }

  # ── The postmortem desk ───────────────────────────────────────────────────
  # Every closed incident replays through here exactly once — even ones
  # closed while this workflow was being edited or the process restarted.
  - name: postmortem
    concurrency: { max_runs: 1, on_overflow: queue }
    steps:
      take:
        kind: stream
        stream: incidents
        subject: "incident.*"
        from: earliest

      write:
        kind: agent
        depends_on: take
        servers: [infra]
        instruction: |
          Write a short blameless postmortem for this incident:
          {{ steps.take.output.data }}
          Timeline, root cause hypothesis, what remediation worked, and ONE
          concrete engineering follow-up that would prevent recurrence.
        output_schema:
          type: object
          required: [followup]
          properties:
            followup: { type: string }
            postmortem: { type: string }

      # Typed: the DataPart engineering's `a2a` start matches on, checked
      # against its declared schema at the listener.
      followup:
        kind: a2a.delegate
        depends_on: write
        peer: engineering
        command: eng.bug
        args:
          ticket: "postmortem-{{ steps.take.output.correlation }}"
          severity: high
          summary: "{{ steps.write.output.followup }}"
        timeout: 10m
        idempotency: true

      fin: { kind: finish, depends_on: [followup], status: completed }
