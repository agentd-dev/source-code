#
# Serving config for the hosted UI. The security posture is the point: this
# host holds no secrets, so the job is to make sure the PAGE cannot be turned
# into a way to reach somewhere it should not.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A liveness target that is not the app, so a probe failing means the
    # server is down rather than the bundle being broken.
    location = /healthz {
        access_log off;
        add_header content-type text/plain always;
        return 200 "ok\n";
    }

    # The Content-Security-Policy is the load-bearing header here.
    #
    # `connect-src` is deliberately WIDE: the whole product is a page that
    # connects to a daemon at an address only the user knows — their laptop,
    # their VPN, their cluster — so we cannot enumerate it. Everything else is
    # closed instead: no third-party script can run, so nothing can abuse that
    # breadth. `script-src 'self'` with no `unsafe-inline` is what makes the
    # wide connect-src acceptable rather than reckless.
    add_header content-security-policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src *; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header x-content-type-options nosniff always;
    add_header referrer-policy no-referrer always;
    # Nothing here needs a camera, a microphone or a location.
    add_header permissions-policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # HSTS is set by the edge that terminates TLS; if this container IS the
    # edge, uncomment:
    # add_header strict-transport-security "max-age=31536000; includeSubDomains" always;

    # Caching uses `expires`, NOT `add_header`, and the reason is a trap worth
    # naming: nginx's add_header is inherited only by blocks that declare no
    # add_header of their own. A `location` that set cache-control with
    # add_header would silently drop every security header above — which is how
    # a site ships without the CSP it appears to configure. `expires` sets
    # Cache-Control through a different mechanism and leaves inheritance alone.
    #
    # The bundle is rebuilt per deploy and the shell points at it, so the shell
    # must never be cached or a deploy strands users on old assets.
    location = /index.html {
        expires -1;
    }
    location ~* \.(js|css)$ {
        expires 7d;
    }

    # A single-page app: unknown paths are the app's routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
